<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>SMART WEB | الصيدلية</title>
<style>
:root{
 --bg:#050807;--panel:#0b1210;--panel2:#0f1915;--line:rgba(255,255,255,.09);
 --green:#9dff00;--green2:#3be477;--blue:#00a8ff;--text:#f4f8f5;--muted:#9aa9a1
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:
 radial-gradient(circle at 12% 15%,rgba(157,255,0,.07),transparent 27%),
 radial-gradient(circle at 90% 35%,rgba(0,168,255,.06),transparent 28%),
 linear-gradient(145deg,var(--bg),#020403);color:var(--text);min-height:100vh}
a{text-decoration:none;color:inherit}
.container{width:min(1180px,92%);margin:auto}

/* word logo only — no image */
.word-logo{
 direction:ltr;display:inline-flex;align-items:center;gap:2px;font-weight:950;
 font-size:31px;letter-spacing:-1.5px;line-height:1;
}
.word-logo .smart{background:linear-gradient(135deg,#d9ff9c,#9dff00 50%,#44df6a);
 -webkit-background-clip:text;background-clip:text;color:transparent}
.word-logo .web{background:linear-gradient(135deg,#a7edff,#22c7ff 55%,#527dff);
 -webkit-background-clip:text;background-clip:text;color:transparent}
.word-logo:after{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);margin-left:5px;box-shadow:0 0 14px var(--green)}

header{position:sticky;top:0;z-index:20;background:rgba(4,8,6,.76);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.nav{height:80px;display:flex;align-items:center;justify-content:space-between}
.navlinks{display:flex;gap:7px}
.navlinks a{padding:10px 16px;border-radius:999px;color:#d8e1dc;transition:.2s}
.navlinks a:hover{background:rgba(157,255,0,.08);color:#fff}

.hero{text-align:center;padding:85px 0 55px}
.hero-logo{margin-bottom:28px;display:inline-flex;animation:logoFloat 3.5s ease-in-out infinite}
.hero-logo .word-logo{font-size:clamp(54px,10vw,112px);letter-spacing:-5px}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(-.7deg)}}
.eyebrow{color:var(--green);font-size:12px;font-weight:900;letter-spacing:4px;margin-bottom:14px}
.hero h1{font-size:clamp(34px,6vw,68px);line-height:1.15;margin-bottom:16px}
.hero h1 span{background:linear-gradient(90deg,#fff,#caffb0,#7dff00);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:720px;margin:auto;color:var(--muted);line-height:1.9;font-size:16px}

/* animated Arabic phrase, assembled letter by letter */
.assembled{margin:34px auto 0;min-height:50px;display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap}
.assembled .char{opacity:0;transform:translateY(22px) scale(.65);display:inline-block;
 background:linear-gradient(135deg,#fff,#b9ff80,#55dcff);-webkit-background-clip:text;background-clip:text;color:transparent;
 animation:charIn .38s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d);font-weight:850;font-size:clamp(22px,3vw,32px)}
@keyframes charIn{to{opacity:1;transform:none}}

.section-head{margin:25px 0 20px;display:flex;align-items:end;justify-content:space-between}
.section-head h2{font-size:29px}.section-head p{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:17px;padding-bottom:85px}
.card{min-height:205px;padding:24px;border:1px solid var(--line);border-radius:25px;
background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.018));
box-shadow:0 20px 60px rgba(0,0,0,.27);position:relative;overflow:hidden;transition:.28s;
display:flex;flex-direction:column;justify-content:space-between}
.card:before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-70px;top:-70px;background:rgba(157,255,0,.09);filter:blur(40px)}
.card:hover{transform:translateY(-8px);border-color:rgba(157,255,0,.3);box-shadow:0 30px 75px rgba(0,0,0,.4),0 0 30px rgba(157,255,0,.05)}
.icon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:25px;
background:linear-gradient(145deg,rgba(157,255,0,.15),rgba(0,168,255,.08));border:1px solid rgba(157,255,0,.15)}
.card h3{font-size:20px;margin:22px 0 8px}.card p{color:var(--muted);font-size:13px;line-height:1.75}
.go{color:var(--green);font-size:13px;font-weight:850;margin-top:15px}
footer{border-top:1px solid var(--line);padding:28px 0;color:#89968f}
.footer{display:flex;justify-content:space-between;align-items:center;gap:15px}
.footer strong{color:#dce7df}

/* service pages */
.page{min-height:calc(100vh - 80px);padding:80px 0}
.service{max-width:850px;margin:auto;text-align:center;padding:60px 30px;border:1px solid var(--line);border-radius:32px;
background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.02));box-shadow:0 25px 80px rgba(0,0,0,.35)}
.service .big-icon{font-size:64px;margin-bottom:18px}
.service h1{font-size:clamp(38px,6vw,60px);margin-bottom:15px}
.service p{color:var(--muted);line-height:2;font-size:17px}
.back{display:inline-block;margin-top:30px;padding:12px 25px;border-radius:999px;border:1px solid rgba(157,255,0,.22);color:var(--green);background:rgba(157,255,0,.07)}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.nav{height:70px}.navlinks a{padding:8px 10px;font-size:13px}.hero{padding-top:55px}.grid{grid-template-columns:1fr}.footer{flex-direction:column;text-align:center}}
</style></head><body>
<header><div class="container nav"><a href="index.html" class="word-logo"><span class="smart">SMART</span><span class="web">WEB</span></a>
<nav class="navlinks"><a href="index.html#about">About</a><a href="index.html#contact">Contact</a></nav></div></header>
<main class="page"><div class="container"><section class="service">
<div class="big-icon">💊</div><div class="eyebrow">SMART WEB SERVICE</div>
<h1>الصيدلية</h1><p>خدمات الصيدلية والمنتجات الصحية في واجهة بسيطة.<br><br>هذه صفحة مستقلة جاهزة لإضافة المحتوى والصور والأدوات الخاصة بالخدمة لاحقاً.</p>
<a class="back" href="index.html">← العودة إلى الرئيسية</a></section></div></main>
<footer><div class="container footer"><strong>SMART WEB • Digital Services</strong><div>Copyright © 2030 Smart Web. All Rights Reserved.</div></div></footer>
</body></html>
